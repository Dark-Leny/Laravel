sonar.projectKey=Dark-Leny_Laravel
sonar.projectName=BiblioTech Laravel
sonar.projectVersion=1.0.0

# Directories
sonar.sources=app,database,routes,config
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# PHP Configuration
sonar.php.coverage.reportPaths=coverage/coverage-report.xml
sonar.php.tests.reportPath=coverage/junit.xml

# Exclusions
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,.idea/**

# Quality Gates
sonar.qualitygate.wait=true

# Issue Exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1108
sonar.issue.ignore.multicriteria.e1.resourceKey=**
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e2.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.e3.ruleKey=common-java:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e3.resourceKey=**/migrations/**
