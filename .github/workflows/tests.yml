name: Laravel Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.3', '8.4']

    services:
      sqlite:
        image: ubuntu:latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
        coverage: xdebug
        tools: composer:v2

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --prefer-dist

    - name: Create SQLite database
      run: touch database/database.sqlite

    - name: Copy .env file
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Run migrations
      run: php artisan migrate --force

    - name: Seed database
      run: php artisan db:seed

    - name: Run Feature Tests
      run: php artisan test tests/Feature --coverage --coverage-text

    - name: Run Unit Tests
      run: php artisan test tests/Unit --coverage --coverage-text

    - name: Generate test coverage Badge
      run: |
        echo "✅ Tests Coverage: Check the output above"

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # full history needed for sonar

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

  php-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: phpstan:latest, php-cs-fixer:latest

    - name: Install dependencies
      run: composer install -q --no-ansi --no-interaction

    - name: Run PHPStan analysis
      run: vendor/bin/phpstan analyse --memory-limit=512M app database tests
      continue-on-error: true

    - name: Run PHP-CS-Fixer
      run: php-cs-fixer fix --dry-run --diff
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [laravel-tests, code-quality, php-lint]
    if: success()

    steps:
    - name: Build Success
      run: echo "✅ All checks passed! Application is ready for production."
